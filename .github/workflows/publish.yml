name: Publish

on:
  release:
    types: [created]

# Read-only by default; the release job gets contents: write to attach the binaries,
# and the publish job gets id-token: write for PyPI trusted publishing.
permissions:
  contents: read

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.23'
          # No module cache in release builds: a poisoned cache would ship in the artifacts.
          cache: false
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          binary=mlscribe
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          suffix="$GOOS-$GOARCH"
          version="${GITHUB_REF_NAME#v}"
          outdir="dist/${binary}-${suffix}"
          mkdir -p "$outdir"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$outdir/${binary}${ext}" .
          if [ "$GOOS" = "windows" ]; then
            (cd "$outdir" && zip -9 "../${binary}-${suffix}.zip" "${binary}${ext}")
          else
            tar -C "$outdir" -czf "dist/${binary}-${suffix}.tar.gz" "${binary}${ext}"
          fi
      - name: Check version flag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dist_bin="dist/mlscribe-linux-amd64/mlscribe"
          "$dist_bin" --version | grep -F "$version"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mlscribe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write # attach the binaries to the release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"

  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.23'
          # No module cache in release builds: a poisoned cache would ship in the artifacts.
          cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: false
      - name: Build wheels
        run: |
          version="${GITHUB_REF_NAME#v}"
          uvx go-to-wheel . \
            --readme README.md \
            --description "ML/DS demo document CLI tool with metrics, gate decisions, and artifact emission" \
            --author 'Lawrence Wu' \
            --license Apache-2.0 \
            --url https://github.com/lawwu/mlscribe \
            --set-version-var main.version \
            --version "$version"
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4.6.2
        with:
          name: python-packages
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels]
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4.3.0
        with:
          name: python-packages
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
