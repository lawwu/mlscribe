name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: '1.23'
      - name: Run tests
        run: go test ./...
