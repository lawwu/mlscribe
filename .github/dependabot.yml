version: 2
updates:
  # Actions are locked in .github/workflows/actions.lock; Dependabot updates it
  # in the same pull request as the version bump.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
